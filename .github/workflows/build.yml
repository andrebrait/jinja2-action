name: Build and Publish Docker Image

# Publishes ghcr.io/<owner>/jinja2-action:<short sha>. action.yml pins the image by digest,
# so changing only action.yml (or tests and docs) does not publish a new image.
on:
  push:
    branches:
      - master
    paths-ignore:
      - README.md
      - action.yml
      - .github/workflows/ci.yml
      - .github/workflows/versioning.yml
      - LICENSE
      - .gitignore
      - test/**
      - unit-tests.py
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the Docker image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$(git rev-parse --short HEAD)"
          docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" -t "$image" .
          docker push "$image"
          echo "Pin in action.yml: docker://$(docker inspect --format '{{index .RepoDigests 0}}' "$image")" | tee -a "$GITHUB_STEP_SUMMARY"
